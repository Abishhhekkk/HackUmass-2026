# Real hardware: Jetson Orin Nano + camera + ESP32 telemetry over USB serial.
mission_id: null          # null => auto-generate per run
drone_id: drone-01
storage_root: data/edge/snapshots

source:
  kind: camera
  device: csi             # "csi" for an IMX219-style CSI camera, or 0 for USB webcam
  width: 1920
  height: 1080
  fps: 30
  # For a prerecorded clip instead:
  # kind: video
  # path: data/flights/clip01.mp4
  # video_start_time: "2026-11-14T15:00:00Z"   # GPS time of the first frame (align with telemetry log)

telemetry:
  kind: serial
  port: /dev/ttyUSB0      # ESP32; check with `ls /dev/ttyUSB* /dev/ttyACM*`
  baud: 115200
  log_path: data/edge/telemetry_log.csv   # keep this: it lets you replay the flight later
  max_gap_s: 1.0
  max_age_s: 2.0

camera:
  width: 1920
  height: 1080
  hfov_deg: 62.2          # IMX219 nominal; replace with calibrated fx/fy/cx/cy

detector:
  kind: yolo
  model_path: models/yolov8n.engine   # build on the Jetson: see docs/hardware.md
  imgsz: 640
  conf_threshold: 0.35
  device: 0
  tracker: bytetrack.yaml

aggregate:
  min_frames: 3
  merge_radius_m: 4.0
  cell_size_m: 10.0
  recency_tau_s: 1800

scheduler:
  search_stride: 4
  active_stride: 1
  thermal_stride: 6
  hold_active_s: 3.0
  thermal_limit_c: 80

snapshot_interval_s: 10

# One JPEG of the frame where each new track is first detected, plus photos_index.csv
# (timestamps + drone pose) under <storage_root>/<mission_id>/photos/. Stays on the drone.
photos:
  enabled: true
  jpeg_quality: 90        # 85-92 is a good size/quality trade-off; lower = smaller files
  queue_size: 8           # photos waiting for the writer thread; skipped (and retried) if full
  max_photos: 500         # safety cap so a busy scene cannot fill the disk

# Compressed flight video in short segments under <storage_root>/<mission_id>/video/, with a
# frame-time log per segment so any timestamp maps to an exact frame. Stays on the drone.
# H.264 is software-encoded (the Orin Nano has no hardware video encoder), so keep the size and
# frame rate modest and watch temperature + dropped frames in the first test flight.
video:
  enabled: true
  width: 1280             # frames are shrunk to this size; photos keep full resolution
  height: 720
  fps: 15                 # frames kept per second (the loop still sees every camera frame)
  segment_s: 60           # new file every 60 s, so a power cut loses seconds, not the flight
  codec: auto             # auto | h264 | mjpg (auto = H.264 if OpenCV has GStreamer, else MJPG)
  bitrate_kbps: 3000      # H.264 only
  threads: 2              # H.264 encoder threads; keep low so the detector keeps its CPU
  queue_size: 15          # frames waiting for the encoder; skipped if it falls behind
  min_free_gb: 2          # stop recording below this much free disk so snapshots keep working

uploader:
  enabled: true
  server_url: https://YOUR-VULTR-HOST
  api_key_env: INGEST_API_KEY
  offline_flag_file: data/edge/OFFLINE

local_server:
  host: 0.0.0.0
  port: 8080
