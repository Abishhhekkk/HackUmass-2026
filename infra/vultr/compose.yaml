# Vantage on one Ubuntu VM: the API + dashboard (repo Dockerfile) behind Caddy, which gets a
# free HTTPS certificate for $DOMAIN automatically. Started by infra/vultr/setup.sh.
services:
  api:
    build: ../..
    env_file: ../../.env          # DATABASE_URL, INGEST_API_KEY, GEMINI_API_KEY
    restart: unless-stopped
    expose: ["8000"]
  caddy:
    image: caddy:2.8
    command: caddy reverse-proxy --from ${DOMAIN} --to api:8000
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data]
    depends_on: [api]
    restart: unless-stopped
volumes:
  caddy_data:
